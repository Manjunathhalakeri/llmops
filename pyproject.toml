[project]
name = "llmops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manjunath Halakeri", email = "100824294+Manjunathhalakeri@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.3",
    "fastapi>=0.165.0",
    "guardrails-ai>=0.11.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llmops = "llmops:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
